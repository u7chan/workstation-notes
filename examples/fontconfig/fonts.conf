<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Chromium の CJK フォールバックを日本語字形に固定する。
       fonts-wqy-zenhei の /etc/fonts/conf.d/64-wqy-zenhei.conf が generic family の
       prefer へ中国語フォント (WenQuanYi Zen Hei) を挿すため、そのままだと日本語が
       中国語字形で描画される。lang=ja を条件にしたルールは Chromium の CJK
       フォールバックに効かないため、generic family の並びそのものを固定する。

       前提: fonts-noto-cjk が入っていること。Latin の見た目を変えないよう DejaVu を
       先に置き、CJK だけ Noto CJK JP へ落とす。 -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
